<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashwin DevOps - Static Website Lab</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.svg" alt="Ashwin DevOps Logo" class="logo">
            <span class="logo-text">ASHWIN DEVOPS</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
    </header>

    <main>
        <section class="hero">
            <h1>ASHWIN DEVOPS</h1>
            <p class="subtitle">Cloud & Storage Account Static Hosting Lab</p>

            <div class="clock-card">
                <h2>LIVE SYSTEM CLOCK</h2>
                <div class="clock-display" id="clock">00:00:00 AM</div>
                <div class="date-display" id="date">Loading Date...</div>
            </div>
        </section>

        <section class="timer-section">
            <div class="container">
                <h2>FOCUS TIMER DASHBOARD</h2>
                <div class="presets">
                    <button class="preset-btn" onclick="setPreset(25)">Pomodoro (25m)</button>
                    <button class="preset-btn" onclick="setPreset(5)">Short Break (5m)</button>
                    <button class="preset-btn" onclick="setPreset(15)">Long Break (15m)</button>
                    <button class="preset-btn" onclick="setPreset(60)">Deep Work (1h)</button>
                </div>

                <div class="timer-display">
                    <svg class="timer-svg" viewBox="0 0 240 240">
                        <circle class="circle-bg" cx="120" cy="120" r="110"></circle>
                        <circle class="circle-progress" id="progress" cx="120" cy="120" r="110"></circle>
                    </svg>
                    <div class="time-text" id="display">25:00</div>
                </div>

                <div class="inputs">
                    <div class="input-group">
                        <label>MINUTES</label>
                        <input type="number" id="mins" value="25" min="0" max="999">
                    </div>
                    <div class="input-group">
                        <label>SECONDS</label>
                        <input type="number" id="secs" value="0" min="0" max="59">
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-start" id="startBtn" onclick="toggleTimer()">START</button>
                    <button class="btn btn-reset" onclick="resetTimer()">RESET</button>
                </div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast">⏱️ Time's Up, Ashwin! Great Work!</div>

    <script src="script.js"></script>
</body>
</html>
